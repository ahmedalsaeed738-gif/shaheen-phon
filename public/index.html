<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاهين فون - Shaheen Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="store-logo" id="storeName">شاهين فون</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ابحث عن هاتف أو إكسسوار..." onkeyup="filterProducts()">
    </div>
    <div class="header-actions">
      <button class="btn-track" onclick="toggleModal('trackModal')">📱 تتبع الطلب</button>
      <div class="cart-icon" onclick="toggleModal('cartModal')">
        🛒 السلة (<span id="cartCount">0</span>)
      </div>
    </div>
  </header>

  <div class="hero-section">
    <img id="storeBanner" src="https://via.placeholder.com/1200x300?text=Shaheen+Phone+Store" alt="بنر المتجر" class="hero-banner">
  </div>

  <div class="container">
    <div class="filter-section">
      <label><b>فلترة الأقسام:</b> </label>
      <select id="categoryFilter" onchange="filterProducts()">
        <option value="الكل">الكل</option>
        <option value="هواتف">هواتف</option>
        <option value="شواحن">شواحن</option>
        <option value="سماعات">سماعات</option>
        <option value="ساعات">ساعات</option>
        <option value="جرابات">جرابات</option>
        <option value="إكسسوارات">إكسسوارات</option>
        <option value="عام">عام</option>
      </select>
    </div>

    <h2>أحدث المنتجات</h2>
    <div id="productsGrid" class="products-grid"></div>
  </div>

  <!-- نافذة تفاصيل المنتج -->
  <div id="productDetailModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('productDetailModal')">&times;</span>
      <div id="productModalBody"></div>
    </div>
  </div>

  <!-- نافذة تتبع الطلب -->
  <div id="trackModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('trackModal')">&times;</span>
      <h3>📱 تتبع طلبك</h3>
      <input type="tel" id="trackPhoneInput" placeholder="أدخل رقم الهاتف المسجل به الطلب">
      <button class="btn-primary" onclick="trackOrders()">بحث عن الطلبات</button>
      <div id="trackResults" style="margin-top:15px;"></div>
    </div>
  </div>

  <!-- نافذة السلة -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('cartModal')">&times;</span>
      <h3>🛒 سلة الشراء</h3>
      <div id="cartItems"></div>
      <hr>
      <h3>بيانات التوصيل</h3>
      <form id="checkoutForm" onsubmit="submitOrder(event)">
        <input type="text" id="custName" placeholder="الاسم بالكامل" required>
        <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
        <textarea id="custAddress" placeholder="العنوان بالتفصيل" required></textarea>
        <textarea id="custNotes" placeholder="ملاحظات أخرى (اختياري)"></textarea>
        <button type="submit" class="btn-primary">إرسال الطلب</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
