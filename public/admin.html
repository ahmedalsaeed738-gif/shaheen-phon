<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - شاهين فون</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="store-logo">لوحة تحكم التاجر</div>
    <a href="/" style="color: white; text-decoration: none;">الرجوع للمتجر ↗</a>
  </header>

  <div class="container">
    <div class="admin-section">
      <h2>➕ إضافة منتج جديد</h2>
      <form id="addProductForm" onsubmit="handleAddProduct(event)">
        <input type="text" id="prodName" placeholder="اسم المنتج" required>
        <input type="number" id="prodPrice" placeholder="السعر (بالجنيه)" required>
        <input type="url" id="prodImage" placeholder="رابط صورة المنتج">
        <button type="submit" class="btn-primary">إضافة المنتج</button>
      </form>
    </div>

    <div class="admin-section" style="margin-top: 30px;">
      <h2>📦 المنتجات الحالية</h2>
      <div id="adminProductsGrid" class="products-grid"></div>
    </div>

    <div class="admin-section" style="margin-top: 30px;">
      <h2>📋 الطلبات الواردة من الزبائن</h2>
      <div id="ordersList"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
