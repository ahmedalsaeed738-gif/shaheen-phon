<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - شاهين فون</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="store-logo">لوحة تحكم التاجر</div>
    <a href="/" style="color: white; text-decoration: none;">الرجوع للمتجر ↗</a>
  </header>

  <div class="container">
    <!-- إعدادات المتجر -->
    <div class="admin-section">
      <h2>⚙️ إعدادات المتجر (الاسم والبنر)</h2>
      <form id="settingsForm" onsubmit="handleSaveSettings(event)">
        <input type="text" id="settingStoreName" placeholder="اسم المتجر">
        <label>صورة بنر المتجر (من الجهاز):</label>
        <input type="file" id="settingBannerFile" accept="image/*">
        <button type="submit" class="btn-primary">حفظ إعدادات المتجر</button>
      </form>
    </div>

    <!-- إضافة / تعديل منتج -->
    <div class="admin-section" style="margin-top: 30px;">
      <h2 id="formTitle">➕ إضافة منتج جديد</h2>
      <form id="productForm" onsubmit="handleSaveProduct(event)">
        <input type="hidden" id="editProductId">
        <input type="text" id="prodName" placeholder="اسم المنتج" required>
        <input type="number" id="prodPrice" placeholder="السعر (بالجنيه)" required>
        
        <label>القسم:</label>
        <select id="prodCategory">
          <option value="عام">عام</option>
          <option value="هواتف">هواتف</option>
          <option value="إكسسوارات">إكسسوارات</option>
          <option value="شواحن وكوابل">شواحن وكوابل</option>
          <option value="ساعات ذكية">ساعات ذكية</option>
        </select>

        <label style="margin-top:10px; display:block;">صورة المنتج (من جهازك):</label>
        <input type="file" id="prodImageFile" accept="image/*">

        <textarea id="prodDesc" placeholder="تفاصيل ومواصفات المنتج..." rows="3"></textarea>
        
        <button type="submit" id="saveProdBtn" class="btn-primary">حفظ المنتج</button>
        <button type="button" id="cancelEditBtn" class="btn-primary" style="background:#6c757d; display:none; margin-top:5px;" onclick="resetProductForm()">إلغاء التعديل</button>
      </form>
    </div>

    <div class="admin-section" style="margin-top: 30px;">
      <h2>📦 المنتجات الحالية</h2>
      <div id="adminProductsGrid" class="products-grid"></div>
    </div>

    <div class="admin-section" style="margin-top: 30px;">
      <h2>📋 الطلبات الواردة من الزبائن</h2>
      <div id="ordersList"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
