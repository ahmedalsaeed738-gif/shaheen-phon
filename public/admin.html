<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - شاهين فون</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="store-logo">لوحة إدارة المتجر</div>
    <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">العودة للمتجر</a>
  </header>

  <div class="container">
    <!-- نموذج إضافة منتج -->
    <div class="admin-card">
      <h2>➕ إضافة منتج جديد</h2>
      <form id="addProductForm" onsubmit="handleAddProduct(event)">
        <input type="text" id="prodName" placeholder="اسم المنتج" required>
        <input type="number" id="prodPrice" placeholder="السعر (بالجنيه)" required>
        
        <select id="prodCategory" required>
          <option value="هواتف">هواتف</option>
          <option value="شواحن">شواحن</option>
          <option value="سماعات">سماعات</option>
          <option value="جرابات">جرابات</option>
          <option value="ساعات">ساعات</option>
          <option value="إكسسوارات أخرى">إكسسوارات أخرى</option>
        </select>

        <input type="text" id="prodImage" placeholder="رابط صورة المنتج (اختياري)">
        <button type="submit" class="btn-primary">حفظ وإضافة المنتج</button>
      </form>
    </div>

    <!-- قائمة إدارة المنتجات الحالية -->
    <div class="admin-card">
      <h2>📦 المنتجات المتاحة</h2>
      <div id="adminProductsList"></div>
    </div>

    <!-- قائمة الطلبات الواردة من الزبائن -->
    <div class="admin-card">
      <h2>📦 الطلبات الواردة من الزبائن</h2>
      <div id="adminOrdersList"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
