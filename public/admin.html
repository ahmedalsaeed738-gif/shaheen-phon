<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم التاجر - شاهين فون</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر العلوي -->
  <header>
    <div class="store-logo">⚙️ لوحة تحكم التاجر</div>
    <a href="index.html" class="admin-btn" style="text-decoration: none; display: inline-block;">🏠 العودة للمتجر</a>
  </header>

  <div class="container">
    <h2>إضافة منتج جديد</h2>
    <form id="addProductForm" onsubmit="handleAddProduct(event)" style="background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
      <input type="text" id="pName" placeholder="اسم المنتج (مثال: سامسونج A55)" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;" required>
      <input type="number" id="pPrice" placeholder="السعر بالجنيه" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;" required>
      <select id="pCategory" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
        <option value="phones">هواتف</option>
        <option value="accessories">إكسسوارات</option>
      </select>
      <input type="text" id="pImg" placeholder="رابط صورة المنتج (URL)" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
      <button type="submit" class="btn-primary">إضافة المنتج</button>
    </form>

    <h2>الطلبات الواردة من الزبائن</h2>
    <div id="ordersList">
      <p>جاري تحميل الطلبات...</p>
    </div>
  </div>

  <script>
    // إضافة منتج جديد
    async function handleAddProduct(e) {
      e.preventDefault();
      const product = {
        name: document.getElementById('pName').value,
        price: parseFloat(document.getElementById('pPrice').value),
        category: document.getElementById('pCategory').value,
        image_url: document.getElementById('pImg').value
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(product)
        });
        if (res.ok) {
          alert('تم إضافة المنتج بنجاح!');
          document.getElementById('addProductForm').reset();
        } else {
          alert('حدث خطأ أثناء إضافة المنتج.');
        }
      } catch (err) {
        console.error('خطأ:', err);
      }
    }

    // جلب الطلبات عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const ordersDiv = document.getElementById('ordersList');
        
        if (!orders || orders.length === 0) {
          ordersDiv.innerHTML = '<p>لا توجد طلبات جديدة حتى الآن.</p>';
          return;
        }

        let html = '';
        orders.forEach(o => {
          html += `
            <div style="background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-right: 5px solid #131921;">
              <h4>طلب رقم #${o.id} - الزبون: ${o.customer_name}</h4>
              <p>📱 الهاتف: ${o.customer_phone}</p>
              <p>📍 العنوان: ${o.customer_address}</p>
              <p>📝 ملاحظات: ${o.notes || 'لا يوجد'}</p>
            </div>
          `;
        });
        ordersDiv.innerHTML = html;
      } catch (err) {
        document.getElementById('ordersList').innerHTML = '<p>تعذر تحميل الطلبات.</p>';
      }
    });
  </script>
</body>
</html>
